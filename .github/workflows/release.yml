name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump to apply when version is empty
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
      version:
        description: Optional exact version, such as 0.2.0
        type: string
        required: false
      prerelease:
        description: Mark the GitHub release as a prerelease
        type: boolean
        default: false
        required: true
      release_notes:
        description: Optional release notes. Leave empty to use generated notes.
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release runs from main
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Releases must run from main, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump plugin version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs")

          const manifestPath = "plugins/opencode/.codex-plugin/plugin.json"
          const bump = process.env.BUMP || "patch"
          const requestedVersion = (process.env.VERSION || "").trim()
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"))
          const current = String(manifest.version || "0.0.0").split("+")[0]

          function parseVersion(value) {
            const match = value.match(/^(\d+)\.(\d+)\.(\d+)$/)
            if (!match) {
              throw new Error(`Expected a SemVer version like 0.2.0, got ${value}`)
            }
            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              value,
            }
          }

          function compareVersions(a, b) {
            for (const key of ["major", "minor", "patch"]) {
              if (a[key] !== b[key]) return a[key] - b[key]
            }
            return 0
          }

          const parsedCurrent = parseVersion(current)
          let next
          let changed = true
          if (requestedVersion) {
            const parsedRequested = parseVersion(requestedVersion)
            const comparison = compareVersions(parsedRequested, parsedCurrent)
            if (comparison < 0) {
              throw new Error(`Requested version ${requestedVersion} must be greater than or equal to ${current}`)
            }
            changed = comparison !== 0
            next = requestedVersion
          } else {
            const nextParts = { ...parsedCurrent }
            if (bump === "major") {
              nextParts.major += 1
              nextParts.minor = 0
              nextParts.patch = 0
            } else if (bump === "minor") {
              nextParts.minor += 1
              nextParts.patch = 0
            } else if (bump === "patch") {
              nextParts.patch += 1
            } else {
              throw new Error(`Unsupported bump: ${bump}`)
            }
            next = `${nextParts.major}.${nextParts.minor}.${nextParts.patch}`
          }

          manifest.version = next
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${next}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed ? "true" : "false"}\n`)
          NODE

      - name: Check release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags origin

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_exists=true
          fi

          release_exists=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [[ "$release_exists" == "true" ]]; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

          if [[ "$tag_exists" == "true" && "${{ steps.version.outputs.changed }}" == "true" ]]; then
            echo "Tag $TAG already exists for a different release state." >&2
            exit 1
          fi

          if [[ "$tag_exists" == "true" ]]; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            head_sha="$(git rev-parse HEAD)"
            if [[ "$tag_sha" != "$head_sha" ]]; then
              echo "Tag $TAG exists but points to $tag_sha, not current HEAD $head_sha." >&2
              exit 1
            fi
          fi

          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        run: python3 -m unittest discover -s tests

      - name: Validate plugin package
        shell: bash
        run: python3 scripts/validate_plugin.py plugins/opencode

      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          git add plugins/opencode/.codex-plugin/plugin.json
          git commit -m "Release ${{ steps.version.outputs.tag }}"

      - name: Push version commit
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          release_target="$(git rev-parse HEAD)"
          args=("$TAG" "--title" "$TAG")
          if [[ "${{ steps.release_state.outputs.tag_exists }}" == "true" ]]; then
            args+=("--verify-tag")
          else
            args+=("--target" "$release_target")
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=("--prerelease")
          fi

          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
            args+=("--notes-file" "release-notes.md")
          else
            args+=("--generate-notes")
          fi

          gh release create "${args[@]}"
