name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and plugin validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate plugin package
        run: python3 scripts/validate_plugin.py plugins/opencode

      - name: Verify the wrapper imports cleanly
        run: python3 plugins/opencode/scripts/opencode-review --help >/dev/null
